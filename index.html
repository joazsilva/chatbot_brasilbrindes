<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atendimento Online</title>
<link rel="stylesheet" href="style.css">


</head>
<body>

<div id="app">
  <div class="chat-bg"></div>

  <!-- HEADER -->
  <header class="chat-header">
    <div class="header-avatar">🛍️</div>
    <div class="header-info">
      <div class="header-name">Atendimento Online</div>
      <div class="header-status">
        <span class="status-dot"></span>
        <span>online agora</span>
      </div>
    </div>
    <div class="header-icons">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </div>
  </header>

  <!-- MESSAGES -->
  <div class="chat-messages" id="chat-messages">
    <div class="date-divider"><span>Hoje</span></div>
  </div>

  <!-- FOOTER -->
  <footer class="chat-footer">
    <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Enviar imagem">
      <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
    </button>
    <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(this)">

    <div class="input-wrap">
      <textarea id="msg-input" placeholder="Digite uma mensagem" rows="1"
        oninput="autoResize(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
      ></textarea>
    </div>

    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </footer>
  <script src="scripts/logic.js"></script>
</div>

</body>
</html>
